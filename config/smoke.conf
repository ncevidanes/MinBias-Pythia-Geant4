# Execução curta para validar instalação, geometria, ROOT e sementes.
events = 3
first_bcid = 0
threads = 1
seed_base = 512

interaction_mode = poisson
mean_interactions = 1.0
fixed_interactions = 1

pythia_config = pythia_minbias.cmnd
physics_list = FTFP_BERT_ATL
production_cut_mm = 1.0

beam_sigma_x_mm = 0.0
beam_sigma_y_mm = 0.0
beam_sigma_z_mm = 0.0
beam_sigma_t_ns = 0.0

max_abs_eta = 1.8
transport_neutrinos = false
generator_audit = true
check_overlaps = true
print_every = 1

output = ../outputs/minbias_smoke.root

