# Produção: 3.000 bunch crossings, pile-up Poisson com média 50.
# Ajuste threads com cautela em máquinas com pouca memória.
events = 3000
first_bcid = 0
threads = 1
seed_base = 512

interaction_mode = poisson
mean_interactions = 50.0
fixed_interactions = 1

pythia_config = pythia_minbias.cmnd
physics_list = FTFP_BERT_ATL
production_cut_mm = 1.0

# Valores nulos evitam introduzir um modelo de região luminosa não validado.
# Substitua por parâmetros documentados da campanha experimental adotada.
beam_sigma_x_mm = 0.0
beam_sigma_y_mm = 0.0
beam_sigma_z_mm = 0.0
beam_sigma_t_ns = 0.0

max_abs_eta = 1.8
transport_neutrinos = false
generator_audit = false
check_overlaps = false
print_every = 10

output = ../outputs/minbias_mu50.root

